services:

  postgres:
    image: postgres:16
    container_name: ai_outreach_postgres_compose

    environment:
      POSTGRES_DB: ai_outreach
      POSTGRES_USER: ai_outreach_user
      POSTGRES_PASSWORD: ai_outreach_password

    volumes:
      - ai_outreach_postgres_data:/var/lib/postgresql/data

    ports:
      - "5434:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_outreach_user -d ai_outreach"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: ai_outreach_redis_compose

    ports:
      - "6380:6379"

    volumes:
      - ai_outreach_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_outreach_migrate

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_outreach_api

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_outreach_worker

    env_file:
      - .env.docker

    user: "1000:1000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    command:
      [
        "celery",
        "-A",
        "app.core.celery_worker.celery_app",
        "worker",
        "--loglevel=info"
      ]


volumes:

  ai_outreach_postgres_data:

  ai_outreach_redis_data: